 ### EILD Event Chain Localisation ###
 GFnytoeild.1.name:0 "The First Breach"
 GFnytoeild.1.desc:0 "Alarms ripple through [Root.GetName] as contaminated ruins beneath the capital begin emitting coherent ELID signatures. Defensive protocols identify the outbreak as an organized intrusion rather than a natural resurgence. The perimeter must be restored before the infection reaches the inhabited districts."
 GFnytoeild.1.a:0 "Seal the infected zone and begin repairs."
 GFnytoeild.2.name:0 "Quarantine Wall Restored"
 GFnytoeild.2.desc:0 "The emergency works have reinforced the quarantine wall around the ruined sector. Automated sentry lines and orbital spotters are now linked into a single defensive grid, buying us time against the next ELID surge."
 NYTOWELLDONE:0 "Well done."
 GFnytoeild.3.name:0 "Heavy Emplacement Repairs"
 GFnytoeild.3.desc:0 "The old roadbed artillery platforms remain buried under collapsed armorcrete. If restored, their fire arcs could cover the quarantine line and blunt any ground assault launched from the ruins."
 GFnytoeild.3.a:0 "Authorize the repair project."
 GFnytoeild.4.name:0 "Batteries Online"
 GFnytoeild.4.desc:0 "The heavy emplacements thunder through their first calibration cycle. Their barrels now track the sealed ruins, ready to punish anything that breaches the perimeter."
 GFnytoeild.4a:0 "Hold the line."
 GFnytoeild.4.a:0 "Understood."
 GFnytoeild.5.name:0 "Defensive Battery Lost"
 GFnytoeild.5.desc:0 "One of the restored defense batteries has fallen silent under ELID pressure. Without rapid repairs, the quarantine line will be left dangerously exposed."
 GFnytoeild.5.a:0 "Begin emergency repairs."
 GFnytoeild.6.name:0 "Emergency Battery Restored"
 GFnytoeild.6.desc:0 "Repair crews have returned the ruined battery to service. The weapon is scarred, unstable, and desperately needed."
 GFnytoeild.6.a:0 "Back to the perimeter."
 GFnytoeild.31.name:0 "Silencing the Ruins"
 GFnytoeild.31.desc:0 "The ELID signals are not merely leaking from the ruins; they are being amplified by systems still active below the rubble. We need a way to locate and shut down the source before the attacks escalate."
 GFnytoeild.31.a:0 "Find the control core."
 GFnytoeild.32.desc:0 "Our teams have traced the repeating ELID pulse to a sealed complex beneath the old city. The shutdown method is crude but viable: breach the inner chamber, sever the conduits, and survive whatever answers."
 NYTOMAYTHEFORCEBEWITHYOU:0 "May fortune favor the assault teams."
 GFnytoeild.33.desc:0 "The ruin's control core is dead. The signal collapses into static, and the organized ELID attacks falter almost immediately. What remains below is dangerous, but no longer coordinated by the buried system."
 NYTORECEIVE:0 "Secure the site."
 GFnytoeild.34.name:0 "Containment Study"
 GFnytoeild.34.desc:0 "With the central signal silenced, several ELID-infected organisms remain alive inside containment traps. Studying them may allow us to understand their altered neural patterns—and perhaps turn that knowledge into a controlled asset."
 GFnytoeild.34.a:0 "Prepare the research teams."
 GFnytoeild.35.desc:0 "The containment study has produced unsettling results. The infected subjects retain a warped but stable response to command conditioning, and their brain-wave patterns can be partially synchronized with our control architecture."
 NYTOGETEILD:0 "Apply the findings."
 GFnytoeild.41.name:0 "ELID Assault Imminent"
 GFnytoeild.41.desc:0 "The first organized ELID formations are moving from the ruins toward our populated zones. Civil defense channels are overloaded, perimeter guns are tracking targets, and every delay worsens the threat."
 GFnytoeild.43.name:0 "ELID Attack Wave"
 GFnytoeild.43.desc:0 "Another ELID wave has surged against the defensive line. The attack pattern adapts with each engagement, forcing our garrisons to respond before the perimeter buckles."
 GFnytoeild.44a.name:0 "Wave Repelled"
 GFnytoeild.44a.desc:0 "The latest ELID attack has been repelled. Salvage teams are already combing the battlefield for usable collapse-fluid residues and combat data."
 GFnytoeild.44ab:0 "Collect the spoils."
 GFnytoeild.59.name:0 "The Hunt Interrupted"
 GFnytoeild.59.desc:0 "The ongoing ELID hunt has been disrupted by battlefield instability. Command links are severed, and the operation must be suspended before it turns into a rout."
 GFnytoeild.59a:0 "Withdraw and regroup."
 GFnytoeild.45.name:0 "Perimeter Collapse"
 GFnytoeild.45.desc:0 "Our first defensive line has broken. ELID forces are flooding through the gaps, and emergency teams are fighting to prevent the capital from falling entirely under their control."
 GFnytoeild.45a:0 "We are not finished yet."
 GFnytoeild.46.name:0 "Capital Overrun"
 GFnytoeild.46.desc:0 "The second breach has become irreversible. ELID swarms overrun the remaining shelters, and the capital's biosphere collapses into a contaminated grave."
 GFnytoeild.46a:0 "A catastrophic loss."
 GFnytoeild.47.name:0 "Recovered, Not Unbroken"
 GFnytoeild.47.desc:0 "Against all expectations, loyal forces have retaken the capital before the ELID occupation became permanent. The world survives, though scarred by losses that will not soon fade."
 GFnytoeild.47a:0 "Begin reconstruction."
 GFnytoeild.10.name:0 "Colony Contamination"
 GFnytoeild.10.desc:0 "Collapse-fluid bombardment has awakened ELID activity across [Root.GetName]. The colony is not the capital, but the pattern is familiar: blackened districts, spreading infection, and a threat that must be contained before it learns to organize."
 GFnytoeild.10.a:0 "Launch a containment operation."
 GFnytoeild.11.desc:0 "The colony containment operation is complete. ELID activity has been suppressed, contaminated sites are being sealed, and local command reports that the colony can be stabilized."
 GFnyto_eild_attack_chain_title:0 "ELID Incursion"
 GFnyto_eild_attack_chain_desc:0 "An organized ELID outbreak is pressing against our defenses. Complete projects and repel assault waves to secure the affected world."
 GFnyto_colony_eild_attack_chain_title:0 "Colony ELID Containment"
 GFnyto_colony_eild_attack_chain_desc:0 "A colony has suffered ELID contamination after collapse-fluid exposure. The outbreak must be contained before it spreads beyond local defenses."
 GFnyto_defense_eild_attack_project:0 "Restore the Quarantine Wall"
 GFnyto_defense_eild_attack_project_DESC:0 "Repair the damaged quarantine wall and reconnect surface defenses around the infected ruin zone."
 GFnyto_defense_eild_attack_Land_base_station:0 "Restore Heavy Roadbed Batteries"
 GFnyto_defense_eild_attack_Land_base_station_DESC:0 "Bring the buried heavy artillery platforms back online to support the quarantine perimeter."
 GFnyto_defense_eild_attack_Land_base_station2:0 "Emergency Battery Repairs"
 GFnyto_defense_eild_attack_Land_base_station2_DESC:0 "Rush repairs on damaged heavy defense batteries before the next ELID assault."
 GFnyto_find_close_ruin_project:0 "Locate the Ruin Control Core"
 GFnyto_find_close_ruin_project_DESC:0 "Trace the ELID command signal inside the ruined complex and identify a way to disable it."
 GFnyto_close_ruin_project:0 "Shut Down the Ruin Core"
 GFnyto_close_ruin_project_DESC:0 "Breach the core chamber and sever the systems coordinating the ELID attacks."
 study_GF_nyto_eild_army_project:0 "Study Contained ELID Subjects"
 study_GF_nyto_eild_army_project_DESC:0 "Analyze surviving ELID-infected organisms and determine whether their command responses can be controlled."
 defense_colony_GF_nyto_eild_attack_project:0 "Contain Colony ELID Activity"
 defense_colony_GF_nyto_eild_attack_project_DESC:0 "Deploy assault teams to purge and seal the contaminated sectors of the colony."
 ### Paradeus Ancient Relic Archaeology Events ###
 gfnytoparadeusancrel.302.name:0 "Buried Transmission"
 gfnytoparadeusancrel.302.desc:0 "Excavation teams have uncovered a collapsed relay chamber beneath the site. Its machinery is ruined, but the surviving signal fragments point to a civilization that expected its final message to be found very late."
 gfnytoparadeusancrel.303.name:0 "Silent Archive"
 gfnytoparadeusancrel.303.desc:0 "A sealed archive layer has been opened. Most records were erased by structural failure, yet recurring fragments describe migration routes, defensive preparations, and a fear of something approaching from beyond their charts."
 gfnytoparadeusancrel.304.name:0 "The Last Calculation"
 gfnytoparadeusancrel.304.desc:0 "The site contains an ancient computational shrine still frozen on its final operation. The result was not a prediction of victory, but a timetable for survival measured in centuries of concealment."
 gfnytoparadeusancrel.305.name:0 "Unknown Civilization: Final Layer"
 gfnytoparadeusancrel.305.desc:0 "The deepest chamber confirms that the unknown civilization deliberately buried its legacy beneath layers of collapse and misdirection. Whatever they feared, they chose secrecy as their last defense."
 ### Miscellaneous Planet Events ###
 GFnyto_other_event.1.name:0 "Emergency Ration Audit"
 GFnyto_other_event.1.desc:0 "A sudden logistics audit has exposed a temporary shortage in the planetary food reserve. The discrepancy is minor, but command requests immediate authorization to rebalance stocks before the colonial network notices."
 GFnyto_other_event.1.a:0 "Cover the shortfall from central reserves."
 GFnyto_other_event.1.b:0 "Leave the reserves untouched."
 GFnyto_other_event.2.name:0 "Auxiliary Server Farm"
 GFnyto_other_event.2.desc:0 "The temporary logistics response has revealed an opportunity: an unused support zone can be converted into a compact server farm to improve local administrative throughput."
 GFnyto_other_event.2.a:0 "Install the servers."
