 ### Event Chains ###
 GFnyto_paradeus_pioneer_chain_title:0 "Ancient building clusters"
 GFnyto_paradeus_pioneer_chain_desc:0 "Way before the birth of our civilization, these remains has appeared on the planet we currently inhabit. We have an instinctive intimacy towards these remains. Even though these ruins had been under wide inspection since the dawn of humanity, there are still no one who can unlock their secrets. Right now, many of our archaeology department think it is time to have another crack at them."
 GFnyto_data_mining_chain_title:0 "Deep into Zion"
 GFnyto_data_mining_chain_desc:0 "Zion still have many areas unknown to us, we must excavate deep. Maybe we can find traces of the ancient civilization."
 GFnyto_crisis_chain_title:0 "Conquer Hell"
 GFnyto_crisis_chain_desc:0 "Through Zion, we foresee an invasion targeted towards the galaxy. We have no chance against the powerful invaders if we only sit and wait. If we can unite the stars, there may still be a slim chance of victory. Unfortunately, those who can see the situation clearly are few and far between."
