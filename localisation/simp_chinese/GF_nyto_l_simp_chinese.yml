 tech_GF_nyto_collapse_stability_bomb:0 "坍缩液稳定技术"
 tech_GF_nyto_collapse_stability_bomb_desc:0 "坍塌液晶格是一种稳定的磁-光囚禁阱装置。最外层为两端金属遮罩及透明材质的外壳,中层在人形眼中为空且围绕内层外侧存在一圈长条状细杆,内层为透明材质的隔离层并有着分别位于其上下两端的共八条呈辐射对称的外延管状物。中层和内层实际上是旋转磁场装置,使得囚禁阱的中心电磁场始终难以为零。"
 tech_GFnyto_accelerating_coil1:0 "瓦解射线"
 tech_GFnyto_accelerating_coil1_desc:0 "这门歼星炮可以使目标行星坍缩,直到它变为黑洞。"
 tech_GFnyto_additional_arithmetic_module:0 "附加运算模块"
 tech_GFnyto_additional_arithmetic_module_desc:0 "为舰船战斗提供巨额运算能力。"
 tech_GFnyto_body_armor1:0 "浮动附加装甲MK.1"
 tech_GFnyto_body_armor1_desc:0 "相较于传统装甲,浮动附加装甲对舰船船体进行机动防御,在保证了防御能力的同时节省了用料和负荷。"
 tech_GFnyto_body_armor2:0 "浮动附加装甲MK.2"
 tech_GFnyto_body_armor2_desc:0 "相较于传统装甲,浮动附加装甲对舰船船体进行机动防御,在保证了防御能力的同时节省了用料和负荷。"
 tech_GFnyto_body_armor3:0 "浮动附加装甲MK.3"
 tech_GFnyto_body_armor3_desc:0 "相较于传统装甲,浮动附加装甲对舰船船体进行机动防御,在保证了防御能力的同时节省了用料和负荷。"
 tech_GFnyto_force_shield1:0 "力场盾MK.1"
 tech_GFnyto_force_shield1_desc:0 "覆盖舰船周围的反作用力场,不仅可以减速敌人的炮火攻击,而且可以为己方实弹攻击加速。相比于普通护盾,力场盾在受到爆破类武器的攻击时更容易超载。"
 tech_GFnyto_force_shield2:0 "力场盾MK.2"
 tech_GFnyto_force_shield2_desc:0 "覆盖舰船周围的反作用力场,不仅可以减速敌人的炮火攻击,而且可以为己方实弹攻击加速。相比于普通护盾,力场盾在受到爆破类武器的攻击时更容易超载。"
 tech_GFnyto_force_shield3:0 "力场盾MK.3"
 tech_GFnyto_force_shield3_desc:0 "覆盖舰船周围的反作用力场,不仅可以减速敌人的炮火攻击,而且可以为己方实弹攻击加速。相比于普通护盾,力场盾在受到爆破类武器的攻击时更容易超载。"

 origin_gf_nyto_attractor_field:0 "吸引子域"
 origin_gf_nyto_attractor_field_desc:0 "这个文明并非诞生于自然演化，而是某种宏大叙事的残余。她们在封闭的中苏醒，记忆支离破碎，唯有刻在基因里的执念指引着方向。"
