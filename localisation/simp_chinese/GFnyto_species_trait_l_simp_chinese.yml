 trait_GF_nyto_week_research:0 "缺陷的科研模块"
 trait_GF_nyto_week_research_desc:0 "剑走偏锋,当下才是最重要的"
 trait_GF_nyto_modesty:0 "减免的学习模块"
 trait_GF_nyto_modesty_desc:0 "不是所有人都拥有学习的权力"
 trait_GF_nyto_Simple_structure:0 "简陋构造"
 trait_GF_nyto_Simple_structure_desc:0 "为了更有效的生存下去,这是自然的选择"
 trait_GF_nyto_Low_local_storage:0 "低本地存储"
 trait_GF_nyto_Low_local_storage_desc:0 "这并非设计缺陷，是不得已的妥协。但在网络不够稳定的地方，却有些致命。"
 trait_GF_nyto_adaptive_interface:0 "活体适应接口"
 trait_GF_nyto_adaptive_interface_desc:0 "如果手断了,脚断了那就将尸体上的肢体切下来,给自己装上。活体适应接口正是为了极端环境下所设计"
 trait_GF_nyto_Open_source_licenses:0 "开源协议"
 trait_GF_nyto_Open_source_licenses_desc:0 "更多的希望,更好的个体,更明亮的未来"
 trait_GF_nyto_External_logic_hardware:0 "外置逻辑硬件"
 trait_GF_nyto_External_logic_hardware_desc:0 "或许并不安全可靠，但对于耗材来说，一个外置大脑会有它的用处。"
 trait_GF_nyto_Self_directed_development:0 "自主学习拓展"
 trait_GF_nyto_Self_directed_development_desc:0 "现在,每个人都能参与学习进程了"
 trait_GF_nyto_Abstract_interface:0 "抽象类接口"
 trait_GF_nyto_Abstract_interface_desc:0 "哈哈,你看起来就像个蜘蛛一样。"
 trait_GF_nyto_cloud_array:0 "云端阵列"
 trait_GF_nyto_cloud_array_desc:0 "网络，生命的另一重保障。云端储存和下载技术将我们的所有资源以最高效的方式整合"
 trait_GF_nyto_Life_life_automata:0 "生命自动机"
 trait_GF_nyto_Life_life_automata_desc:0 "自动机乃生命的最高形式"