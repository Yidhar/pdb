 operation_nyto_pop2_desc:0 "通过潜伏在目标帝国内部的个体，我们可以组织游行、暴乱，乃至更广泛的社会失序。"
 operation_nyto_leader:0 "领袖策反"
 operation_nyto_leader_desc:0 "一名被渗透的领袖，会成为敌方指挥体系中最隐蔽也最锋利的刀。"
