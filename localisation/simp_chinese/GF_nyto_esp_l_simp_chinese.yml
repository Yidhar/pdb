 ### GF Nyto Espionage Operations ###
 operation_nyto_pop:0 "人口替代"
 operation_nyto_pop_desc:0 "我们可以通过替代关键人物与悄然埋入渗透者，在目标帝国内部播下灾祸的种子，甚至连高层官员也不例外。"
