 decision_GFnyto_planetary_defense:0 "行星防御"
 decision_GFnyto_planetary_defense_effects:1 "为行星添加行星轨道防御系统和行星地表防御系统。"
 decision_GFnyto_planetary_defense_desc:1 "停留在这个星球轨道上的敌方舰队会不断受到伤害。"
 decision_GFnyto_yaosai:0 "要塞化计划"
 decision_GFnyto_yaosai_desc:0 "打造一个永恒钢铁要塞星球"
 decision_GFnyto_yaosai_desc1:0 "通过决议将允许建造永固要塞，将我们的城市打造成钢铁要塞。"
