district_GF_nyto_pc_toxic_trade_plural:0 "$district_GF_nyto_pc_toxic_trade$"
district_GF_nyto_pc_toxic_trade_desc:0 "整篇区域只为一个功能而建设,而那就是对帝国军队的指挥调度"
