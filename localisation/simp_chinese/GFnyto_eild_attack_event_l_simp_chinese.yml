 ### EILD Event Warning Cleanup ###
 ok:0 "好"
 城防巨炮:0 "城防巨炮"
 ELID-infected:0 "ELID感染者"
 EILD:0 "EILD"
 GF_nyto_Elid_level:0 "ELID威胁等级"
 GF_nyto_ai_rbq:0 "前进基地战备区"
 ### EILD Event Chain Localisation ###
 GFnytoeild.1.name:0 "初次突破"
 GFnytoeild.1.desc:0 "[Root.GetName]全境警报骤然响起，首都地下受污染的遗迹开始释放连续的ELID信号。防御协议判断，这并非自然复燃，而是一场有组织的入侵。我们必须在感染蔓延至居住区前修复外围防线。"
 GFnytoeild.1.a:0 "封锁感染区并开始修复。"
 GFnytoeild.2.name:0 "隔离墙修复完成"
 GFnytoeild.2.desc:0 "紧急工程已加固废墟区周边的隔离墙。自动哨戒线与轨道观测设备被接入同一防御网，为我们争取了应对下一轮ELID冲击的时间。"
 NYTOWELLDONE:0 "做得好。"
 GFnytoeild.3.name:0 "重型炮台修复"
 GFnytoeild.3.desc:0 "旧式路基巨炮仍埋在坍塌的装甲混凝土下。若能将其修复，它们的射界足以覆盖隔离线，并削弱任何来自废墟的地面攻势。"
 GFnytoeild.3.a:0 "批准修复项目。"
 GFnytoeild.4.name:0 "炮台上线"
 GFnytoeild.4.desc:0 "重型炮台完成了第一次校准轰鸣。炮口已锁定封闭废墟，随时准备惩罚任何突破外围防线的目标。"
 GFnytoeild.4a:0 "守住防线。"
 GFnytoeild.4.a:0 "明白。"
 GFnytoeild.5.name:0 "防御炮台损毁"
 GFnytoeild.5.desc:0 "一座修复后的防御炮台在ELID压力下失去响应。若不尽快抢修，隔离线将暴露出危险缺口。"
 GFnytoeild.5.a:0 "开始紧急抢修。"
 GFnytoeild.6.name:0 "紧急炮台修复完成"
 GFnytoeild.6.desc:0 "维修队已让损毁炮台重新投入运作。它伤痕累累、状态不稳，但我们现在正需要它。"
 GFnytoeild.6.a:0 "回到外围防线。"
 GFnytoeild.31.name:0 "令遗迹沉默"
 GFnytoeild.31.desc:0 "ELID信号并非只是从遗迹中泄漏出来；它们正被废墟深处仍在运作的系统放大。在攻击升级前，我们必须找到并关闭源头。"
 GFnytoeild.31.a:0 "寻找控制核心。"
 GFnytoeild.32.desc:0 "我们的队伍已追踪到反复出现的ELID脉冲源头：旧城地下的一座封闭设施。关停方案粗暴但可行——突入内室，切断导管，然后活着回来。"
 NYTOMAYTHEFORCEBEWITHYOU:0 "愿好运眷顾突击队。"
 GFnytoeild.33.desc:0 "遗迹控制核心已经停摆。信号坍缩成杂讯，有组织的ELID攻击也几乎立刻瓦解。地下残留物依然危险，但不再受那套埋藏系统协调。"
 NYTORECEIVE:0 "控制现场。"
 GFnytoeild.34.name:0 "收容研究"
 GFnytoeild.34.desc:0 "中央信号沉寂后，数个ELID感染体仍被困在收容陷阱中。研究它们或许能帮助我们理解其异化神经模式——甚至将这种知识转化为可控资产。"
 GFnytoeild.34.a:0 "准备研究队。"
 GFnytoeild.35.desc:0 "收容研究得出了令人不安的结果。感染体保留着扭曲却稳定的指令响应，其脑波模式可以被部分同步至我们的控制架构。"
 NYTOGETEILD:0 "应用研究成果。"
 GFnytoeild.41.name:0 "ELID攻势将至"
 GFnytoeild.41.desc:0 "第一批有组织的ELID编队正从废墟向人口区域推进。民防频道已不堪重负，外围炮台正在锁定目标，而每一次延迟都会扩大威胁。"
 GFnytoeild.43.name:0 "ELID攻击波"
 GFnytoeild.43.desc:0 "又一波ELID冲击撞上了防御线。它们的攻击模式正随着每次交战不断适应，迫使驻军在外围防线崩溃前作出反应。"
 GFnytoeild.44a.name:0 "攻击波击退"
 GFnytoeild.44a.desc:0 "最新一轮ELID攻击已被击退。回收队已经开始搜索战场，寻找可用的坍缩液残留与战斗数据。"
 GFnytoeild.44ab:0 "收集战利品。"
 GFnytoeild.59.name:0 "狩猎中断"
 GFnytoeild.59.desc:0 "正在进行的ELID狩猎因战场不稳定而中断。指挥链路被切断，为避免行动演变成溃败，必须暂停作战。"
 GFnytoeild.59a:0 "撤离并重整。"
 GFnytoeild.45.name:0 "外围防线崩溃"
 GFnytoeild.45.desc:0 "我们的第一道防线已经被突破。ELID部队正从缺口涌入，紧急队伍正在全力阻止首都完全落入其控制。"
 GFnytoeild.45a:0 "我们还没有结束。"
 GFnytoeild.46.name:0 "首都沦陷"
 GFnytoeild.46.desc:0 "第二次突破已无法逆转。ELID群体淹没了残存避难所，首都生物圈坍塌为受污染的坟场。"
 GFnytoeild.46a:0 "灾难性的损失。"
 GFnytoeild.47.name:0 "夺回，但并未完好"
 GFnytoeild.47.desc:0 "出乎所有人意料，忠诚部队在ELID占领永久化前夺回了首都。这个世界幸存了下来，却留下了短时间内无法抹去的创伤。"
 GFnytoeild.47a:0 "开始重建。"
 GFnytoeild.10.name:0 "殖民地污染"
 GFnytoeild.10.desc:0 "坍缩液轰炸唤醒了[Root.GetName]上的ELID活动。这里不是首都，但模式如出一辙：焦黑地块、扩散感染，以及一个必须在学会组织前被压制的威胁。"
 GFnytoeild.10.a:0 "启动收容行动。"
 GFnytoeild.11.desc:0 "殖民地收容行动已经完成。ELID活动被压制，污染区域正被封闭，当地指挥部报告殖民地已可重新稳定。"
 GFnyto_eild_attack_chain_title:0 "ELID入侵"
 GFnyto_eild_attack_chain_desc:0 "一场有组织的ELID爆发正冲击我们的防御。完成项目并击退攻击波，以确保受影响世界的安全。"
 GFnyto_colony_eild_attack_chain_title:0 "殖民地ELID收容"
 GFnyto_colony_eild_attack_chain_desc:0 "一座殖民地在坍缩液暴露后出现ELID污染。必须在其突破地方防线前完成收容。"
 GFnyto_defense_eild_attack_project:0 "修复隔离墙"
 GFnyto_defense_eild_attack_project_DESC:0 "修复受损隔离墙，并重新连接感染废墟区周边的地表防御。"
 GFnyto_defense_eild_attack_Land_base_station:0 "修复重型路基炮台"
 GFnyto_defense_eild_attack_Land_base_station_DESC:0 "让埋藏的重型火炮平台重新上线，以支援隔离外围防线。"
 GFnyto_defense_eild_attack_Land_base_station2:0 "紧急炮台抢修"
 GFnyto_defense_eild_attack_Land_base_station2_DESC:0 "在下一轮ELID攻势到来前，抢修受损的重型防御炮台。"
 GFnyto_find_close_ruin_project:0 "定位遗迹控制核心"
 GFnyto_find_close_ruin_project_DESC:0 "追踪遗迹复合体内的ELID指挥信号，并找出关闭它的方法。"
 GFnyto_close_ruin_project:0 "关闭遗迹核心"
 GFnyto_close_ruin_project_DESC:0 "突入核心舱室，切断协调ELID攻击的系统。"
 study_GF_nyto_eild_army_project:0 "研究收容ELID个体"
 study_GF_nyto_eild_army_project_DESC:0 "分析幸存的ELID感染体，判断其指令响应是否可以受控。"
 defense_colony_GF_nyto_eild_attack_project:0 "收容殖民地ELID活动"
 defense_colony_GF_nyto_eild_attack_project_DESC:0 "部署突击队清剿并封闭殖民地受污染区域。"
 ### Paradeus Ancient Relic Archaeology Events ###
 gfnytoparadeusancrel.302.name:0 "埋藏传讯"
 gfnytoparadeusancrel.302.desc:0 "发掘队在遗址下方发现了一座坍塌的中继室。其设备已成废墟，但残存的信号片段显示，这个文明似乎预料到自己的最终讯息会在极其遥远的未来被发现。"
 gfnytoparadeusancrel.303.name:0 "沉默档案馆"
 gfnytoparadeusancrel.303.desc:0 "一层封闭档案区被打开。多数记录已因结构崩塌而抹除，但反复出现的残片提到了迁徙路线、防御准备，以及对某种来自星图之外之物的恐惧。"
 gfnytoparadeusancrel.304.name:0 "最后的计算"
 gfnytoparadeusancrel.304.desc:0 "遗址内有一座古老计算圣坛，仍冻结在最后一次运算上。结果并非胜利预言，而是一份以数个世纪隐匿为单位的生存时间表。"
 gfnytoparadeusancrel.305.name:0 "未知文明：最终层"
 gfnytoparadeusancrel.305.desc:0 "最深处的舱室证实，这个未知文明曾刻意将自己的遗产埋在层层崩塌与误导之下。不论他们恐惧的是什么，保密就是他们最后的防线。"
 ### Miscellaneous Planet Events ###
 GFnyto_other_event.1.name:0 "紧急口粮审计"
 GFnyto_other_event.1.desc:0 "一场突发后勤审计暴露出行星食品储备的临时缺口。差额并不严重，但指挥部请求立即授权重新平衡库存，以免殖民网络察觉异常。"
 GFnyto_other_event.1.a:0 "从中央储备弥补缺口。"
 GFnyto_other_event.1.b:0 "不要动用储备。"
 GFnyto_other_event.2.name:0 "辅助服务器农场"
 GFnyto_other_event.2.desc:0 "临时后勤响应揭示了一个机会：一片未使用的支援区可以被改建为紧凑型服务器农场，以提升本地行政吞吐量。"
 GFnyto_other_event.2.a:0 "安装服务器。"
